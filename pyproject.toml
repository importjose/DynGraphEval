[project]
name = "dyngrapheval"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "py-tgb>=2.2",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "modal>=0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Run scripts from the repo root so that `models.*` and `evaluate.*`
# resolve as top-level packages (no src/ wrapper needed).
packages = ["models", "evaluate", "modal"]
