[project]
name = "dyngrapheval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "torch-scatter>=2.1",
    "py-tgb>=2.2",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dyngrapheval"]
